name: Test Workflow - Always Running

# Этот workflow запускается на всех возможных событиях для тестирования
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:
  schedule:
    # Запуск каждые 6 часов
    - cron: '0 */6 * * *'
  issues:
    types: [opened, closed]
  repository_dispatch:

jobs:
  test-commands:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Show system information
      run: |
        echo "=== SYSTEM INFO ==="
        echo "Date: $(date)"
        echo "OS: $(uname -a)"
        echo "User: $(whoami)"
        echo "Working directory: $(pwd)"
        echo "Home directory: $HOME"
        echo ""
        
    - name: Show environment variables
      run: |
        echo "=== ENVIRONMENT VARIABLES ==="
        echo "GITHUB_WORKFLOW: $GITHUB_WORKFLOW"
        echo "GITHUB_RUN_ID: $GITHUB_RUN_ID"
        echo "GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
        echo "GITHUB_ACTOR: $GITHUB_ACTOR"
        echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
        echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
        echo ""
        
    - name: List files in repository
      run: |
        echo "=== REPOSITORY FILES ==="
        ls -la
        echo ""
        echo "=== TREE STRUCTURE ==="
        tree || (echo "tree not available, using find instead:" && find . -type f | head -20)
        echo ""
        
    - name: Show Git information
      run: |
        echo "=== GIT INFORMATION ==="
        echo "Git branch: $(git branch --show-current)"
        echo "Git commit: $(git rev-parse HEAD)"
        echo "Git status:"
        git status --porcelain
        echo "Last commit:"
        git log -1 --oneline
        echo ""
        
    - name: Run some test commands
      run: |
        echo "=== TEST COMMANDS ==="
        echo "Random number: $RANDOM"
        echo "Process list (first 10):"
        ps aux | head -10
        echo ""
        echo "Memory info:"
        free -h || echo "free command not available"
        echo ""
        echo "Disk usage:"
        df -h
        echo ""
        
    - name: Create test file
      run: |
        echo "=== CREATING TEST FILE ==="
        echo "Test file created at $(date)" > test-output.txt
        echo "Workflow run #$GITHUB_RUN_NUMBER" >> test-output.txt
        echo "Triggered by: $GITHUB_EVENT_NAME" >> test-output.txt
        cat test-output.txt
        echo ""
        
    - name: Show network information
      run: |
        echo "=== NETWORK INFO ==="
        echo "Public IP:"
        curl -s ifconfig.me || echo "Could not get public IP"
        echo ""
        echo "DNS resolution test:"
        nslookup github.com || echo "nslookup failed"
        echo ""
        
    - name: Final message
      run: |
        echo "=== WORKFLOW COMPLETED ==="
        echo "✅ Test workflow completed successfully!"
        echo "Time: $(date)"
        echo "This workflow will run on every push, PR, schedule, and other events"
        echo "Perfect for testing GitHub Actions! 🚀"
